<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 308" role="img" aria-label="Tajalli's Home and Commercial Solutions">

  <!-- ── ICON: house + building, centered ────────────────────────── -->
  <g transform="translate(170,0)">

    <!-- Building: filled navy rectangle -->
    <rect x="97" y="20" width="58" height="118" fill="#1b3a6e"/>
    <!-- Window grid — vertical dividers -->
    <line x1="111" y1="20" x2="111" y2="138" stroke="white" stroke-width="2"/>
    <line x1="124" y1="20" x2="124" y2="138" stroke="white" stroke-width="2"/>
    <line x1="137" y1="20" x2="137" y2="138" stroke="white" stroke-width="2"/>
    <!-- Window grid — horizontal dividers -->
    <line x1="97"  y1="43"  x2="155" y2="43"  stroke="white" stroke-width="2"/>
    <line x1="97"  y1="66"  x2="155" y2="66"  stroke="white" stroke-width="2"/>
    <line x1="97"  y1="89"  x2="155" y2="89"  stroke="white" stroke-width="2"/>
    <line x1="97"  y1="112" x2="155" y2="112" stroke="white" stroke-width="2"/>

    <!-- House outline (stroke only, no fill) -->
    <!-- Path: bottom-left → left wall → chimney → peak → right roof → right wall → bottom -->
    <path d="M 5,138 L 5,72 L 20,56 L 20,38 L 35,38 L 35,56 L 65,10 L 100,56 L 100,138 Z"
          fill="none" stroke="#1b3a6e" stroke-width="5.5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Curved baseline / swoosh -->
    <path d="M 0,146 Q 78,160 158,146"
          fill="none" stroke="#1b3a6e" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ── TEXT ────────────────────────────────────────────────────── -->

  <!-- Brand name -->
  <text x="14" y="228"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="76"
        fill="#1b3a6e" letter-spacing="-1">Tajalli&#x2019;s</text>

  <!-- Subtitle -->
  <text x="16" y="263"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400" font-size="27"
        fill="#1b3a6e" letter-spacing="0.2">Home &amp; Commercial Solutions</text>

  <!-- Divider -->
  <line x1="14" y1="275" x2="486" y2="275" stroke="#8a9fc2" stroke-width="0.8"/>

  <!-- Tagline -->
  <text x="100" y="300"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400" font-size="24"
        fill="#1b3a6e">From Homes to Corporates</text>

</svg>
