<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 162" role="img" aria-label="Tajalli's">

  <!-- Building: filled orange rectangle -->
  <rect x="97" y="20" width="58" height="118" fill="#f97316"/>
  <!-- Window grid — vertical -->
  <line x1="111" y1="20" x2="111" y2="138" stroke="white" stroke-width="2"/>
  <line x1="124" y1="20" x2="124" y2="138" stroke="white" stroke-width="2"/>
  <line x1="137" y1="20" x2="137" y2="138" stroke="white" stroke-width="2"/>
  <!-- Window grid — horizontal -->
  <line x1="97"  y1="43"  x2="155" y2="43"  stroke="white" stroke-width="2"/>
  <line x1="97"  y1="66"  x2="155" y2="66"  stroke="white" stroke-width="2"/>
  <line x1="97"  y1="89"  x2="155" y2="89"  stroke="white" stroke-width="2"/>
  <line x1="97"  y1="112" x2="155" y2="112" stroke="white" stroke-width="2"/>

  <!-- House outline -->
  <path d="M 5,138 L 5,72 L 20,56 L 20,38 L 35,38 L 35,56 L 65,10 L 100,56 L 100,138 Z"
        fill="none" stroke="#f97316" stroke-width="5.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Curved base -->
  <path d="M 0,146 Q 78,160 158,146"
        fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

</svg>
