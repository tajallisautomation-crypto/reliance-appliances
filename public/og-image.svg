<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B2545"/>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#123F73"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#123F73"/>
      <stop offset="100%" stop-color="#F6C400"/>
    </linearGradient>
  </defs>
  <!-- Logo box -->
  <rect x="80" y="80" width="96" height="96" rx="22" fill="url(#logo-grad)"/>
  <text x="128" y="148" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="white" text-anchor="middle">R</text>
  <!-- Brand name -->
  <text x="200" y="132" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white">Reliance</text>
  <text x="200" y="166" font-family="Arial, sans-serif" font-size="24" fill="#C4D5EC">by Tajallis</text>
  <!-- Tagline -->
  <text x="80" y="280" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="white">Home Appliances</text>
  <text x="80" y="350" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="white">in Karachi</text>
  <!-- Sub-tagline -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="28" fill="#99B6DD">ACs · Fridges · Washing Machines · Solar Systems</text>
  <!-- Badge -->
  <rect x="80" y="470" width="360" height="60" rx="30" fill="#F6C400"/>
  <text x="260" y="508" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#0B2545" text-anchor="middle">Easy Installments Available</text>
  <!-- URL -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="22" fill="#6A94CC" text-anchor="end">reliance.tajallis.com.pk</text>
</svg>
