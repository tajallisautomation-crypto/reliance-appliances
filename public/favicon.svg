<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background pill -->
  <rect width="32" height="32" rx="7" fill="#123F73"/>
  <!-- Scaled house + building icon (from 160x162 → 32x32, scale≈0.1875) -->
  <g transform="translate(1, 1) scale(0.1875)">
    <!-- Building -->
    <rect x="97" y="20" width="58" height="118" fill="white"/>
    <line x1="111" y1="20" x2="111" y2="138" stroke="#F6C400" stroke-width="10"/>
    <line x1="124" y1="20" x2="124" y2="138" stroke="#F6C400" stroke-width="10"/>
    <line x1="137" y1="20" x2="137" y2="138" stroke="#F6C400" stroke-width="10"/>
    <line x1="97"  y1="55"  x2="155" y2="55"  stroke="#F6C400" stroke-width="10"/>
    <line x1="97"  y1="89"  x2="155" y2="89"  stroke="#F6C400" stroke-width="10"/>
    <line x1="97"  y1="122" x2="155" y2="122" stroke="#F6C400" stroke-width="10"/>
    <!-- House outline -->
    <path d="M 5,138 L 5,72 L 20,56 L 20,38 L 35,38 L 35,56 L 65,10 L 100,56 L 100,138 Z"
          fill="none" stroke="white" stroke-width="16"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
