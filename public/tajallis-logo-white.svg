<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 335" role="img" aria-label="Tajalli's Home and Commercial Solutions">

  <!-- ── ICON ────────────────────────────────────────────────────── -->
  <g transform="translate(170,0)">

    <!-- Building: white fill on dark bg -->
    <rect x="97" y="20" width="58" height="118" fill="white"/>
    <!-- Window grid — orange lines (visible against white building) -->
    <line x1="111" y1="20" x2="111" y2="138" stroke="#f97316" stroke-width="2"/>
    <line x1="124" y1="20" x2="124" y2="138" stroke="#f97316" stroke-width="2"/>
    <line x1="137" y1="20" x2="137" y2="138" stroke="#f97316" stroke-width="2"/>
    <line x1="97"  y1="43"  x2="155" y2="43"  stroke="#f97316" stroke-width="2"/>
    <line x1="97"  y1="66"  x2="155" y2="66"  stroke="#f97316" stroke-width="2"/>
    <line x1="97"  y1="89"  x2="155" y2="89"  stroke="#f97316" stroke-width="2"/>
    <line x1="97"  y1="112" x2="155" y2="112" stroke="#f97316" stroke-width="2"/>

    <!-- House outline — white stroke -->
    <path d="M 5,138 L 5,72 L 20,56 L 20,38 L 35,38 L 35,56 L 65,10 L 100,56 L 100,138 Z"
          fill="none" stroke="white" stroke-width="5.5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Curved base — white -->
    <path d="M 0,146 Q 78,160 158,146"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ── TEXT — all white ─────────────────────────────────────────── -->

  <text x="14" y="228"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="76"
        fill="white" letter-spacing="-1">Tajalli&#x2019;s</text>

  <text x="16" y="263"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400" font-size="27"
        fill="rgba(255,255,255,0.85)" letter-spacing="0.2">Home &amp; Commercial Solutions</text>

  <line x1="14" y1="275" x2="486" y2="275" stroke="rgba(249,115,22,0.4)" stroke-width="0.8"/>

  <text x="100" y="300"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400" font-size="24"
        fill="rgba(255,255,255,0.7)">From Homes to Corporates</text>

  <!-- Urdu tagline -->
  <text x="250" y="328"
        font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="rgba(255,255,255,0.55)"
        text-anchor="middle"
        direction="rtl" unicode-bidi="bidi-override">گھروں سے اداروں تک</text>

</svg>
